 <header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 flex items-center justify-between px-4 sm:px-6 transition-colors duration-200">
  
  <!-- Left: Brand Logo & Navigation -->
  <div class="flex items-center gap-6">
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-violet-600 via-indigo-600 to-pink-600 dark:from-violet-400 dark:via-indigo-300 dark:to-pink-400 bg-clip-text text-transparent">
            Workbench
          </span>
          <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 dark:bg-violet-950/80 dark:text-violet-300 border border-violet-200 dark:border-violet-800">
            Studio
          </span>
        </div>
      </div>
    </a>
  </div>

  <!-- Center: Search Bar -->
  <div class="hidden lg:flex items-center flex-1 max-w-md mx-6">
    <div class="relative w-full">
      <i class="pi pi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Search streamers, categories, games..."
        class="w-full pl-10 pr-4 py-2 text-sm rounded-full border border-slate-200 dark:border-slate-700 bg-slate-100/80 dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500 transition-all"
      />
    </div>
  </div>

  <!-- Right: Action Buttons & User Menu -->
  <div class="flex items-center gap-3">

    @if (authService.currentUser(); as user) {
    <!-- Go To Studio Button (Highlight) -->
      <a

        routerLink="/studio"
        class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white text-sm font-semibold shadow-md shadow-violet-600/20 active:scale-95 transition-all"
        pTooltip="Open OBS Web Broadcast Studio"
        tooltipPosition="bottom"
      >
        <i class="pi pi-sliders-h"></i>
        <span class="hidden md:inline">Web Studio</span>
      </a>
    }

    <!-- Theme Toggle (Light / Dark) -->
    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center transition-colors"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [pTooltip]="themeService.isDark() ? 'Switch to Light' : 'Switch to Dark'"
      tooltipPosition="bottom"
    >
      <i [class]="themeService.isDark() ? 'pi pi-sun text-amber-400 text-lg' : 'pi pi-moon text-indigo-600 text-lg'"></i>
    </button>

    <!-- Profile Avatar or Login -->
    @if (authService.currentUser(); as user) {
      <div class="relative" (click)="$event.stopPropagation()">
        <button
          type="button"
          (click)="toggleProfileMenu()"
          [attr.aria-expanded]="isProfileMenuOpen"
          aria-haspopup="menu"
          class="flex items-center gap-2.5 p-1 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <img
            [src]="user.avatar"
            [alt]="user.name"
            class="w-9 h-9 rounded-xl object-cover border-2 border-violet-500/60 ring-2 ring-violet-500/20"
          />
          <span class="hidden xl:inline text-sm font-medium text-slate-700 dark:text-slate-200">
            {{ user.name }}
          </span>
        </button>

        <!-- Dropdown Menu -->
        <div
          [class.hidden]="!isProfileMenuOpen"
          class="absolute right-0 top-full mt-2 w-56 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl py-2 z-50"
          role="menu"
        >
          <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-800">
            <div class="font-semibold text-sm text-slate-900 dark:text-white truncate">{{ user.name }}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ user.email }}</div>
            <div class="mt-1 inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-100 dark:bg-violet-950/80 text-violet-700 dark:text-violet-300">
              {{ user.role === 'creator' ? '⭐ Broadcaster Tier' : 'Viewer' }}
            </div>
          </div>

          <a routerLink="/channel/alexrivers" (click)="toggleProfileMenu()" class="flex items-center gap-2.5 px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-violet-50 dark:hover:bg-slate-800">
            <i class="pi pi-video text-violet-500"></i>
            <span>My Channel</span>
          </a>

          <a routerLink="/studio" (click)="toggleProfileMenu()" class="flex items-center gap-2.5 px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-violet-50 dark:hover:bg-slate-800">
            <i class="pi pi-sliders-h text-indigo-500"></i>
            <span>Broadcast Studio</span>
          </a>

          <a routerLink="/profile" (click)="toggleProfileMenu()"   class="flex items-center gap-2.5 px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-violet-50 dark:hover:bg-slate-800">
            <i class="pi pi-cog text-slate-400"></i>
            <span>Creator Settings</span>
          </a>

          <div class="border-t border-slate-100 dark:border-slate-800 mt-1 pt-1">
            <button
              (click)="logout()"
              class="w-full text-left flex items-center gap-2.5 px-4 py-2 text-sm text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30"
            >
              <i class="pi pi-sign-out"></i>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    } @else {
      <a
        routerLink="/login"
        class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      >
        Sign In
      </a>
    }

  </div>
</header>
