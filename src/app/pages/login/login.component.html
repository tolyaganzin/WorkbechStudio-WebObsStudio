<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 transition-colors">
  
  <!-- Card Container -->
  <div class="w-full max-w-md rounded-3xl border border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl shadow-2xl overflow-hidden p-8 space-y-6">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-pink-500 flex items-center justify-center text-white mx-auto shadow-lg shadow-violet-500/30">
        <i class="pi pi-video text-xl font-bold"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">
        Workbench Studio
      </h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Broadcast, compose, and stream directly from your browser
      </p>
    </div>

    <!-- 1-Click Fast Demo Login (Recommended for Review) -->
    <div class="p-4 rounded-2xl bg-violet-50 dark:bg-violet-950/40 border border-violet-200 dark:border-violet-800/60 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-violet-700 dark:text-violet-300 uppercase tracking-wider">
          ⚡️ 1-Click Instant Demo
        </span>
        <span class="text-[10px] px-1.5 py-0.5 rounded bg-violet-200 dark:bg-violet-900 text-violet-800 dark:text-violet-200 font-bold">
          Instant
        </span>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button
          type="button"
          (click)="loginCreator()"
          class="p-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold shadow-md shadow-violet-600/30 flex flex-col items-center gap-1 transition-all active:scale-95"
        >
          <span>⭐ Broadcaster Tier</span>
          <span class="text-[10px] font-normal opacity-90">Alex Rivers</span>
        </button>

        <button
          type="button"
          (click)="loginViewer()"
          class="p-2.5 rounded-xl bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 text-xs font-bold flex flex-col items-center gap-1 transition-all active:scale-95"
        >
          <span>💬 Viewer Tier</span>
          <span class="text-[10px] font-normal opacity-90">Sarah Connor</span>
        </button>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
      <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Or with credentials</span>
      <div class="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
    </div>

    <!-- Tabs: Sign In vs Sign Up -->
    <div class="flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
      <button
        type="button"
        (click)="activeTab.set('signin')"
        class="flex-1 py-2 text-xs font-bold rounded-lg transition-all"
        [ngClass]="activeTab() === 'signin'
          ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm'
          : 'text-slate-500'"
      >
        Sign In
      </button>
      <button
        type="button"
        (click)="activeTab.set('signup')"
        class="flex-1 py-2 text-xs font-bold rounded-lg transition-all"
        [ngClass]="activeTab() === 'signup'
          ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm'
          : 'text-slate-500'"
      >
        Register Channel
      </button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="handleCustomAuth()" class="space-y-4">
      @if (activeTab() === 'signup') {
        <div>
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Display Name / Channel</label>
          <input
            type="text"
            [(ngModel)]="name"
            name="name"
            required
            placeholder="e.g. MasterCoder"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-violet-500"
          />
        </div>
      }

      <div>
        <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="you@workbench.tv"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-violet-500"
        />
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-violet-500"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs shadow-lg shadow-violet-600/30 transition-all active:scale-95"
      >
        {{ activeTab() === 'signin' ? 'Sign In to Workbench' : 'Create Creator Channel' }}
      </button>
    </form>

    <!-- Social Logins -->
    <div class="space-y-2">
      <p class="text-center text-[11px] text-slate-400">Or continue with</p>
      <div class="grid grid-cols-3 gap-2">
        <button
          type="button"
          (click)="loginCreator()"
          class="py-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 flex items-center justify-center gap-1.5 transition-colors"
        >
          <i class="pi pi-discord text-indigo-500"></i>
          <span>Twitch</span>
        </button>
        <button
          type="button"
          (click)="loginCreator()"
          class="py-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 flex items-center justify-center gap-1.5 transition-colors"
        >
          <i class="pi pi-youtube text-rose-500"></i>
          <span>YouTube</span>
        </button>
        <button
          type="button"
          (click)="loginCreator()"
          class="py-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 flex items-center justify-center gap-1.5 transition-colors"
        >
          <i class="pi pi-github text-slate-900 dark:text-white"></i>
          <span>GitHub</span>
        </button>
      </div>
    </div>

  </div>

</div>
